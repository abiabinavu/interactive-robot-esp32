<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="t d"><title id="t">Interactive ESP32 robot assistant reference circuit</title><desc id="d">Suggested wiring for ESP32, OLED, touch sensor, microphone, audio amplifier, speaker and servo, with Wi-Fi ChatGPT backend architecture.</desc><style>text{font-family:Arial, sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.label{font-size:20px;font-weight:bold}.s{font-size:16px}.t{font-size:14px}.b{fill:#f5f8fc;stroke:#334155;stroke-width:2;rx:14}.l{stroke:#2563eb;stroke-width:3;fill:none}.a{stroke:#7c3aed;stroke-width:3;fill:none}.p{stroke:#d97706;stroke-width:4;fill:none}.g{stroke:#475569;stroke-width:3;fill:none}.n{stroke:#0891b2;stroke-width:3;stroke-dasharray:9 7;fill:none}</style><rect width="1400" height="850" fill="white"/><text x="40" y="50" class="title">Interactive ESP32 Robot Assistant — Reference Circuit</text><text x="40" y="82" class="s">Question/answer audio, cute expressions, and touch-triggered movement. Suggested parts only; verify actual hardware.</text>
<rect x="470" y="235" width="450" height="360" class="b"/><text x="505" y="275" class="label">ESP32 DevKit (classic)</text><text x="505" y="318" class="s">GPIO21 / 22 ↔ OLED SDA / SCL</text><text x="505" y="355" class="s">GPIO27 ← TTP223 touch output</text><text x="505" y="392" class="s">GPIO18 → servo signal</text><text x="505" y="435" class="s">GPIO33 / 26 / 25 ← mic SD / SCK / WS</text><text x="505" y="478" class="s">GPIO32 / 14 / 13 → amp DIN / BCLK / LRC</text><text x="505" y="525" class="s">Wi-Fi ↔ secure backend ↔ ChatGPT</text><text x="505" y="562" class="t">Keep API credentials on the backend.</text>
<rect x="45" y="135" width="340" height="135" class="b"/><text x="70" y="175" class="label">SSD1306 OLED</text><text x="70" y="213" class="s">VCC 3V3, GND, SDA GPIO21, SCL GPIO22</text><text x="70" y="245" class="t">Displays friendly expressions.</text>
<rect x="45" y="325" width="340" height="135" class="b"/><text x="70" y="365" class="label">TTP223 touch module</text><text x="70" y="403" class="s">VCC 3V3, GND, OUT GPIO27</text><text x="70" y="435" class="t">Touch triggers face and shake.</text>
<rect x="45" y="515" width="340" height="150" class="b"/><text x="70" y="555" class="label">INMP441 I2S microphone</text><text x="70" y="593" class="s">VDD 3V3, GND, SD GPIO33</text><text x="70" y="625" class="s">SCK GPIO26, WS GPIO25</text>
<rect x="1010" y="135" width="340" height="150" class="b"/><text x="1035" y="175" class="label">MAX98357A amplifier</text><text x="1035" y="213" class="s">VIN rated 5V, GND common</text><text x="1035" y="247" class="s">DIN/BCLK/LRC GPIO32/14/13</text><text x="1035" y="273" class="t">Speaker connects to amp outputs.</text>
<rect x="1010" y="325" width="340" height="105" class="b"/><text x="1035" y="365" class="label">Speaker</text><text x="1035" y="403" class="s">Connect to amplifier outputs only.</text>
<rect x="1010" y="470" width="340" height="145" class="b"/><text x="1035" y="510" class="label">SG90 micro servo</text><text x="1035" y="548" class="s">Signal GPIO18; V+ separate 5V</text><text x="1035" y="582" class="t">Share ground; never power from GPIO.</text>
<rect x="470" y="665" width="450" height="125" class="b"/><text x="505" y="705" class="label">Secure application backend</text><text x="505" y="743" class="s">Speech-to-text → ChatGPT → answer audio</text><text x="505" y="773" class="t">Protocol/services depend on actual implementation.</text>
<path d="M385 200H430V318H470M385 390H440V355H470M385 590H445V435H470" class="l"/><path d="M920 478H970V210H1010M1180 285V325M920 392H975V540H1010" class="a"/><path d="M695 595V665" class="n"/>
<rect x="1010" y="675" width="340" height="115" class="b"/><text x="1035" y="715" class="label">Power notes</text><text x="1035" y="753" class="s">Rated regulated supplies for servo/audio.</text><text x="1035" y="781" class="t">Share low-voltage grounds; verify modules.</text></svg>