<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 interactive robot wiring reference</title>
  <desc id="desc">Block wiring reference for a classic ESP32 DevKit, TB6612FNG driver, two DC motors, HC-SR04 sensor with an echo voltage divider, and a start button.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 15px; }
    .tiny { font-size: 13px; }
    .box { fill: #f5f8fc; stroke: #334155; stroke-width: 2; rx: 12; }
    .power { stroke: #d97706; stroke-width: 4; fill: none; }
    .logic { stroke: #2563eb; stroke-width: 3; fill: none; }
    .ground { stroke: #475569; stroke-width: 3; fill: none; }
    .motor { stroke: #7c3aed; stroke-width: 4; fill: none; }
    .sensor { stroke: #059669; stroke-width: 3; fill: none; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="48" class="title">ESP32 Interactive Robot — Reference Wiring</text>
  <text x="40" y="78" class="small">Assumed parts and pin choices; compare against your actual board and modules before powering.</text>

  <rect x="55" y="155" width="335" height="300" class="box"/>
  <text x="78" y="190" class="label">ESP32 DevKit (classic ESP32)</text>
  <text x="78" y="230" class="small">GPIO26 / 27 / 25 → AIN1 / AIN2 / PWMA</text>
  <text x="78" y="261" class="small">GPIO33 / 32 / 14 → BIN1 / BIN2 / PWMB</text>
  <text x="78" y="292" class="small">GPIO13 → STBY</text>
  <text x="78" y="333" class="small">GPIO18 → HC-SR04 TRIG</text>
  <text x="78" y="364" class="small">GPIO19 ← ECHO via divider</text>
  <text x="78" y="405" class="small">GPIO23 ← button to GND</text>
  <text x="78" y="437" class="small">3V3, GND → driver logic supply/common</text>

  <rect x="470" y="170" width="305" height="255" class="box"/>
  <text x="495" y="205" class="label">TB6612FNG breakout</text>
  <text x="495" y="243" class="small">VCC: 3V3 logic</text>
  <text x="495" y="271" class="small">VM: motor battery (+)</text>
  <text x="495" y="299" class="small">GND: common ground</text>
  <text x="495" y="341" class="small">A01 / A02: left motor</text>
  <text x="495" y="370" class="small">B01 / B02: right motor</text>
  <text x="495" y="402" class="small">Driver inputs from ESP32 GPIO</text>

  <rect x="875" y="190" width="255" height="90" class="box"/>
  <text x="900" y="225" class="label">Left DC gear motor</text>
  <text x="900" y="255" class="small">Match motor and battery ratings</text>
  <rect x="875" y="325" width="255" height="90" class="box"/>
  <text x="900" y="360" class="label">Right DC gear motor</text>
  <text x="900" y="390" class="small">Stall current must suit driver</text>

  <path d="M390 270 H470" class="logic"/>
  <text x="396" y="258" class="tiny">GPIO control</text>
  <path d="M390 319 H470" class="ground"/>
  <text x="398" y="311" class="tiny">3V3 + GND</text>
  <path d="M390 379 H470" class="power"/>
  <text x="398" y="371" class="tiny">VM from motor battery</text>
  <path d="M775 250 H835 V235 H875" class="motor"/>
  <path d="M775 345 H835 V370 H875" class="motor"/>

  <rect x="55" y="505" width="330" height="125" class="box"/>
  <text x="78" y="540" class="label">HC-SR04 ultrasonic module</text>
  <text x="78" y="570" class="small">VCC: 5V · GND: common · TRIG: GPIO18</text>
  <text x="78" y="600" class="small">ECHO → 2kΩ series → node → GPIO19</text>
  <text x="78" y="622" class="tiny">3.3kΩ from node to GND scales a 5V ECHO to about 3.1V.</text>
  <path d="M220 455 V480 H220 V505" class="sensor"/>

  <rect x="435" y="505" width="260" height="125" class="box"/>
  <text x="458" y="540" class="label">Start/stop button</text>
  <text x="458" y="572" class="small">One side → GPIO23</text>
  <text x="458" y="601" class="small">Other side → GND</text>
  <text x="458" y="622" class="tiny">Firmware uses INPUT_PULLUP.</text>

  <rect x="745" y="505" width="385" height="125" class="box"/>
  <text x="768" y="540" class="label">Power and wiring notes</text>
  <text x="768" y="572" class="small">Use a separate motor supply at the motor rating.</text>
  <text x="768" y="601" class="small">Join ESP32, driver, and battery grounds.</text>
  <text x="768" y="622" class="tiny">Never power motors from ESP32 3V3 or GPIO pins.</text>

  <line x1="55" y1="660" x2="95" y2="660" class="logic"/>
  <text x="105" y="665" class="tiny">logic</text>
  <line x1="175" y1="660" x2="215" y2="660" class="motor"/>
  <text x="225" y="665" class="tiny">motor outputs</text>
  <line x1="340" y1="660" x2="380" y2="660" class="power"/>
  <text x="390" y="665" class="tiny">motor supply</text>
  <line x1="500" y1="660" x2="540" y2="660" class="ground"/>
  <text x="550" y="665" class="tiny">common ground</text>
</svg>